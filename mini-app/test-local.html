<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occupy Uranus - Local Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .test-banner {
            background: #ff6b00;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .test-controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-controls h3 {
            margin-top: 0;
        }
        .test-controls button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .test-controls button:hover {
            background: #0052a3;
        }
        .test-controls button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .console-output {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        iframe {
            width: 100%;
            height: 800px;
            border: 3px solid #444;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="test-banner">
        🧪 LOCAL TESTING MODE - Not connected to Telegram
    </div>

    <div class="test-controls">
        <h3>Test Controls</h3>
        <button onclick="reloadApp()">Reload App</button>
        <button onclick="openDevTools()">Open in New Tab (for DevTools)</button>
        <button onclick="testWithMockData()">Load with Mock Data</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>

    <div class="test-controls">
        <h3>Console Output</h3>
        <div class="console-output" id="consoleOutput">
            Waiting for app to load...<br>
        </div>
    </div>

    <iframe id="appFrame" src="app-v1.html"></iframe>

    <script>
        const consoleOutput = document.getElementById('consoleOutput');
        const appFrame = document.getElementById('appFrame');

        function log(message, type = 'info') {
            const colors = {
                info: '#0f0',
                warn: '#ff0',
                error: '#f00',
                success: '#0ff'
            };
            const timestamp = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.style.color = colors[type] || '#0f0';
            line.textContent = `[${timestamp}] ${message}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        function reloadApp() {
            log('Reloading app...', 'info');
            appFrame.src = appFrame.src;
        }

        function openDevTools() {
            window.open('app-v1.html', '_blank');
            log('Opened in new tab - press F12 for DevTools', 'success');
        }

        function testWithMockData() {
            log('Mock data testing not yet implemented', 'warn');
            log('For now, open app-v1.html directly and check browser console', 'info');
        }

        function clearConsole() {
            consoleOutput.innerHTML = '';
            log('Console cleared', 'info');
        }

        // Capture console messages from iframe (won't work due to CORS, but worth trying)
        window.addEventListener('message', (event) => {
            if (event.data.type === 'console') {
                log(event.data.message, event.data.level);
            }
        });

        log('Test harness loaded', 'success');
        log('Opening app-v1.html in iframe...', 'info');
        log('Note: Console output from iframe may not appear here due to browser security', 'warn');
        log('Use "Open in New Tab" button and press F12 to see full console', 'info');
    </script>
</body>
</html>
