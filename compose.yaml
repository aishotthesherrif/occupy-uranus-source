# Occupy Uranus — local / single-host run. See docs/DOCKER.md.
#
#   cp .env.example .env     # add a (dev) bot token
#   docker compose up --build
#   docker compose watch     # same, plus live sync of code edits into the container

# Fixed project name, so containers and the uranus-state volume keep their names if the folder is renamed
name: occupy-uranus

services:
  uranus:
    build: .
    image: occupy-uranus
    ports:
      - "${URANUS_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    volumes:
      - uranus-state:/var/lib/uranus
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - .git/
            - logs/
            - docs/
            - notes/
            - media/
            - .env
        - action: rebuild
          path: Dockerfile

volumes:
  uranus-state:
